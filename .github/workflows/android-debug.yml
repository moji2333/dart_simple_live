name: build-android-debug

# 手动触发：仓库页面 Actions -> build-android-debug -> Run workflow
on:
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: "17"
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version-file: simple_live_app/.fvmrc
          cache: true

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: >-
            platform-tools
            platforms;android-36
            build-tools;35.0.0

      - name: Configure Android JDK
        run: flutter config --jdk-dir "$JAVA_HOME"

      - name: Restore packages
        working-directory: simple_live_app
        run: flutter pub get

      # debug 包用 debug 密钥自动签名，可直接安装；不需要仓库配置任何 secrets
      - name: Build APK
        working-directory: simple_live_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: simple-live-apk-debug
          path: simple_live_app/build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error
